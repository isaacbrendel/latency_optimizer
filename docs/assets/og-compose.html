<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Latency Engine — Thumbnail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #fbfbf9;
      color: #000;
      font-family: "Times New Roman", Times, Georgia, serif;
    }
    .page {
      width: 1200px;
      height: 630px;
      padding: 36px 42px;
    }
    .paper {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 1px solid #d3d3d3;
      padding: 48px 56px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kicker {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #333;
    }
    h1 {
      margin-top: 20px;
      font-weight: normal;
      font-size: 110px;
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    .sub {
      margin-top: 18px;
      font-size: 34px;
      line-height: 1.25;
      max-width: 980px;
    }
    .bottom {
      border-top: 3px solid #000;
      padding-top: 28px;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .stat {
      font-family: "Courier New", Courier, monospace;
      font-size: 120px;
      font-weight: 800;
      color: #005f00;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .note {
      font-size: 36px;
      line-height: 1.2;
      font-style: italic;
    }
    .url {
      margin-top: 18px;
      font-family: "Courier New", Courier, monospace;
      font-size: 26px;
      color: #000080;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="paper">
      <div>
        <div class="kicker">Working Draft · Replication Study</div>
        <h1>Latency Engine</h1>
        <p class="sub">Lock-free ring buffer for Level-2 market data in Go</p>
      </div>
      <div>
        <div class="bottom">
          <div class="stat">611×</div>
          <div class="note">less heap · microsecond<br />fan-out under load</div>
        </div>
        <div class="url">latency-optimizer.vercel.app</div>
      </div>
    </div>
  </div>
</body>
</html>
