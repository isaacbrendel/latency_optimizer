name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Go 1.22 Race, Fuzz & Jest API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go race + tests
        run: go test -race -count=1 ./...

      - name: Short fuzz
        run: |
          go test -run=^$ -fuzz=FuzzRingBufferPublishRead -fuzztime=5s . || true
          go test -run=^$ -fuzz=FuzzFixedPointUSD -fuzztime=5s . || true

      - name: Build test binary for Jest
        run: go build -v -o server_test_bin .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & run Jest
        run: |
          npm ci || npm install
          npm test
