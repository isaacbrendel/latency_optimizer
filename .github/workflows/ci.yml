name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Go 1.22 Race, Fuzz & Jest API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go race + tests
        run: go test -race -count=1 ./...

      - name: Coverage floor
        run: |
          go test -coverprofile=coverage.out ./engine/
          go tool cover -func=coverage.out | tee coverage.txt
          # Fail if engine package coverage drops below 50% (hot path is heavily tested)
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN { if (p+0 < 50) { printf("coverage %.1f%% < 50%%\n", p); exit 1 } else { printf("coverage OK: %.1f%%\n", p) } }'

      - name: Short fuzz (must pass)
        run: |
          go test -run=^$ -fuzz=FuzzRingBufferPublishRead -fuzztime=5s ./engine
          go test -run=^$ -fuzz=FuzzFixedPointUSD -fuzztime=5s ./engine

      - name: Build test binary for Jest
        run: go build -v -o server_test_bin .

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & run Jest
        run: |
          npm ci || npm install
          npm test
